<!doctype html>
<html lang="zh-CN" data-theme="night">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="房贷计算器">
    <meta name="format-detection" content="telephone=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
    <title>房贷计算器 · 商业贷款与个税估算</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon.png?v=10">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=10">
    <link rel="stylesheet" href="vendor/plyr/plyr.css">
    <link rel="stylesheet" href="styles.css">
    <script src="js/version.js"></script>
    <script src="js/theme-boot.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <main id="v-calc" class="view calc-app" aria-label="房贷计算器">
        <header class="nav">
          <div class="nav-row three">
            <span></span>
            <div class="mid" id="calc-title">房贷计算</div>
            <span class="r"></span>
          </div>
        </header>
        <main class="calc">
          <div class="calc-inner">
            <div class="seg" role="tablist" id="calc-mode" aria-label="计算类型">
              <button class="on" type="button" data-finance-mode="mortgage" aria-selected="true">房贷计算</button>
              <button type="button" data-finance-mode="tax" aria-selected="false">个税计算</button>
            </div>

            <section id="mortgage-panel" class="calc-panel" aria-label="商业贷款计算">
              <form id="mortgage-form" novalidate autocomplete="off">
                <div class="chead">
                  <div><small>商业贷款</small><b>月供估算</b></div>
                  <span class="pill">LPR 参考 3.10%</span>
                </div>
                <div class="group">
                  <label class="row frow" for="loan-amount">
                    <span class="lab">贷款金额</span>
                    <input
                      id="loan-amount"
                      type="text"
                      inputmode="decimal"
                      maxlength="12"
                      placeholder="请输入金额"
                      autocomplete="off"
                      spellcheck="false"
                      aria-describedby="loan-amount-error"
                      data-decimal-input
                    >
                    <span class="unit">元</span>
                  </label>
                  <label class="row frow" for="loan-years">
                    <span class="lab">贷款年限</span>
                    <input
                      id="loan-years"
                      type="text"
                      inputmode="numeric"
                      maxlength="2"
                      value="30"
                      autocomplete="off"
                      aria-describedby="loan-years-error"
                    >
                    <span class="unit">年</span>
                  </label>
                  <label class="row frow" for="loan-rate">
                    <span class="lab">年利率</span>
                    <input
                      id="loan-rate"
                      type="text"
                      inputmode="decimal"
                      maxlength="5"
                      value="3.10"
                      autocomplete="off"
                      aria-describedby="loan-rate-error"
                    >
                    <span class="unit">%</span>
                  </label>
                </div>
                <p id="loan-amount-error" class="ferr" role="status" aria-live="polite" hidden></p>
                <p id="loan-years-error" class="ferr" role="status" aria-live="polite" hidden></p>
                <p id="loan-rate-error" class="ferr" role="status" aria-live="polite" hidden></p>

                <div class="clab">还款方式</div>
                <div class="seg" role="group" aria-label="还款方式">
                  <button class="on" type="button" data-repayment="equal-payment" aria-pressed="true">等额本息</button>
                  <button type="button" data-repayment="equal-principal" aria-pressed="false">等额本金</button>
                </div>
                <button id="mortgage-submit" class="cta" type="submit" disabled>计算</button>
                <p id="setup-hint" class="gf setup-hint" hidden>首次使用：在贷款金额中输入 4–8 位数字并计算，完成本机偏好设置（建议 6–8 位）</p>

                <section id="mortgage-result" class="res" aria-live="polite" hidden>
                  <div class="rh">
                    <small id="result-term">等额本息 · 360 期</small>
                    <b>计算结果</b>
                  </div>
                  <p id="result-summary" class="sum"></p>
                  <div class="big">
                    <span id="result-monthly-label">每月月供</span>
                    <div><output id="result-monthly" class="fit-output"></output><i class="result-unit">元</i></div>
                  </div>
                  <div id="result-decrease-row" class="kv" hidden>
                    <span>每月递减</span>
                    <b><output id="result-decrease" class="fit-output"></output><i class="result-unit">元</i></b>
                  </div>
                  <div class="kv">
                    <span>支付利息</span>
                    <b><output id="result-interest" class="fit-output"></output><i class="result-unit">元</i></b>
                  </div>
                  <div class="kv">
                    <span>还款总额</span>
                    <b><output id="result-total" class="fit-output"></output><i class="result-unit">元</i></b>
                  </div>
                  <p class="note">以上为按月计息估算，未计入提前还款、利率浮动或银行手续费。</p>
                </section>
              </form>
            </section>

            <section id="tax-panel" class="calc-panel" aria-label="个税估算" hidden>
              <form id="tax-form" novalidate autocomplete="off">
                <div class="chead">
                  <div><small>综合所得 · 月度</small><b>个税估算</b></div>
                  <span class="pill">起征点 5,000</span>
                </div>
                <div class="group">
                  <label class="row frow" for="tax-income">
                    <span class="lab">税前月收入</span>
                    <input
                      id="tax-income"
                      type="text"
                      inputmode="decimal"
                      maxlength="12"
                      placeholder="请输入金额"
                      autocomplete="off"
                      spellcheck="false"
                      aria-describedby="tax-income-error"
                      data-decimal-input
                    >
                    <span class="unit">元</span>
                  </label>
                  <label class="row frow" for="tax-insurance">
                    <span class="lab">五险一金</span>
                    <input
                      id="tax-insurance"
                      type="text"
                      inputmode="decimal"
                      maxlength="12"
                      value="0"
                      placeholder="0.00"
                      autocomplete="off"
                      spellcheck="false"
                      aria-describedby="tax-insurance-error"
                      data-decimal-input
                    >
                    <span class="unit">元</span>
                  </label>
                  <label class="row frow" for="tax-deduction">
                    <span class="lab">专项附加扣除</span>
                    <input
                      id="tax-deduction"
                      type="text"
                      inputmode="decimal"
                      maxlength="12"
                      value="0"
                      placeholder="0.00"
                      autocomplete="off"
                      spellcheck="false"
                      aria-describedby="tax-deduction-error"
                      data-decimal-input
                    >
                    <span class="unit">元</span>
                  </label>
                </div>
                <p id="tax-income-error" class="ferr" role="status" aria-live="polite" hidden></p>
                <p id="tax-insurance-error" class="ferr" role="status" aria-live="polite" hidden></p>
                <p id="tax-deduction-error" class="ferr" role="status" aria-live="polite" hidden></p>
                <button id="tax-submit" class="cta" type="submit">计算</button>

                <section id="tax-result" class="res" aria-live="polite" hidden>
                  <div class="rh">
                    <small>综合所得 · 月度估算</small>
                    <b>计算结果</b>
                  </div>
                  <div class="big">
                    <span>应缴个税</span>
                    <div><output id="tax-payable" class="fit-output"></output><i class="result-unit">元</i></div>
                  </div>
                  <div class="kv">
                    <span>应纳税所得额</span>
                    <b><output id="tax-taxable" class="fit-output"></output><i class="result-unit">元</i></b>
                  </div>
                  <div class="kv">
                    <span>税后收入</span>
                    <b><output id="tax-after-income" class="fit-output"></output><i class="result-unit">元</i></b>
                  </div>
                  <p class="note">按现行七级超额累进税率估算，未覆盖年终奖、劳务等特殊情形。</p>
                </section>
              </form>
            </section>

            <p class="disc">计算结果仅供参考，实际以贷款机构及税务机关核定为准。</p>
          </div>
        </main>
      </main>

      <div id="panel-root" class="panel-root"></div>
      <div id="ui-layer" class="ui-layer"></div>
    </div>

    <noscript>
      <p class="noscript-message">请启用 JavaScript 后使用房贷计算器。</p>
    </noscript>

    <script src="vendor/plyr/plyr.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
